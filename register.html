      <label>Vārds, Uzvārds:<br><input type="text" placeholder="[Ievadiet savu vārdu un uzvārdu...]"></label><br>

      <label>Apstiprināt paroli:<br><input type="password" placeholder="[Ievadiet paroli vēlreiz...]"></label><br>
      <label><input type="checkbox"> Piekrītu lietošanas noteikumiem</label><br>
      <button type="submit">[ Reģistrēties ]</button><br>
      <a href="autorizācija lapai.html">Jau ir konts? [Pieslēgties]</a>
    </form>

      <img src="attels1.jpg" alt="Dekors">
