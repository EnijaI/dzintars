      .star {
          position: absolute;
          width: 50px;
          height: 50px;
          background: pink;
          clip-path: polygon(
              50% 0%,

              98% 35%,

              79% 91%, 
              50% 70%, 
              21% 91%, 
              32% 57%, 
              2% 35%, 
              39% 35%
          );
          opacity: 0.6;
      }
      .star.top-left { top: -15px; left: -15px; }
      .star.top-right { top: -15px; right: -15px; }
      .star.bottom-left { bottom: -15px; left: -15px; }
      .star.bottom-right { bottom: -15px; right: -15px; }
